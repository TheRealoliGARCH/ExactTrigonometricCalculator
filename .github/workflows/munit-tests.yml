name: MUnit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  munit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run MUnit tests with Wolfram Engine 14.3
        env:
          WOLFRAM_LICENSE_ENTITLEMENT_ID: ${{ secrets.WOLFRAM_LICENSE_ENTITLEMENT_ID }}
        run: |
          docker run --rm \
            -e WOLFRAM_LICENSE_ENTITLEMENT_ID \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            wolframresearch/wolframengine:14.3.0 \
            wolframscript -file tests/run_tests.wls
